<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ギフト案内</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <div class="marquee" aria-label="音が鳴るギフト一覧">
    <div class="track" id="track">
      <div class="set" id="gift-set">
        <div class="gift">
          <img src="udon.png" alt="うどん脳">
          <div class="name">うどん脳</div>
          <div class="price"><span class="coin">◆</span>10</div>
        </div>
        <div class="gift">
          <img src="nebaru.png" alt="ねば〜る君">
          <div class="name">ねば〜る君</div>
          <div class="price"><span class="coin">◆</span>10</div>
        </div>
        <div class="gift">
          <img src="love.png" alt="愛してる">
          <div class="name">愛してる</div>
          <div class="price"><span class="coin">◆</span>199</div>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js?v=3"></script>
</body>
</html>
