<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ギフト案内</title>
<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
}

body {
  display: flex;
  align-items: flex-start;
  justify-content: flex-start;
  font-family: Arial, "Yu Gothic", "Meiryo", sans-serif;
}

/* 表示される範囲を420×165pxに固定 */
.viewport {
  position: relative;
  width: 420px;
  height: 165px;
  overflow: hidden;
  background: transparent;
}

/* 3つを一まとまりとして流す */
.track {
  position: absolute;
  left: 0;
  top: 0;
  display: flex;
  width: max-content;
  height: 165px;
  will-change: transform;
}

.group {
  display: flex;
  align-items: center;
  flex: none;
  gap: 14px;
  width: max-content;
  height: 165px;
  padding-right: 28px;
}

.gift {
  flex: none;
  width: 92px;
  text-align: center;
  color: #fff;
  filter: drop-shadow(0 3px 4px rgba(0,0,0,.85));
}

.gift img {
  display: block;
  width: 92px;
  height: 92px;
  object-fit: contain;
}

.name {
  margin-top: 1px;
  font-size: 15px;
  line-height: 1.15;
  font-weight: 900;
  white-space: nowrap;
  text-shadow:
    -2px -2px 0 #000,
     2px -2px 0 #000,
    -2px  2px 0 #000,
     2px  2px 0 #000;
}

.price {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-top: 4px;
  padding: 2px 8px 3px;
  border-radius: 999px;
  background: rgba(0,0,0,.68);
  font-size: 14px;
  font-weight: 900;
}

.coin {
  display: inline-grid;
  place-items: center;
  width: 17px;
  height: 17px;
  border-radius: 50%;
  background: linear-gradient(#fff47c,#ff9f00);
  color: #fff;
  font-size: 9px;
}
</style>
</head>
<body>
<div class="viewport">
  <div class="track" id="track">
    <div class="group" id="group">
      <div class="gift">
        <img src="love.png" alt="愛してる">
        <div class="name">愛してる</div>
        <div class="price"><span class="coin">◆</span>199</div>
      </div>
      <div class="gift">
        <img src="udon.png" alt="うどん脳">
        <div class="name">うどん脳</div>
        <div class="price"><span class="coin">◆</span>10</div>
      </div>
      <div class="gift">
        <img src="nebaru.png" alt="ねば〜る君">
        <div class="name">ねば〜る君</div>
        <div class="price"><span class="coin">◆</span>10</div>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const track = document.getElementById("track");
  const group = document.getElementById("group");

  // 同じ3個セットを後ろに1つだけ複製
  const clone = group.cloneNode(true);
  clone.removeAttribute("id");
  clone.setAttribute("aria-hidden", "true");
  track.appendChild(clone);

  // 1秒に6px。かなりゆっくり
  const speed = 6;
  let x = 0;
  let last = performance.now();

  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    x += speed * dt;

    const groupWidth = group.getBoundingClientRect().width;
    if (groupWidth > 0 && x >= groupWidth) {
      x -= groupWidth;
    }

    track.style.transform = `translate3d(${-x}px, 0, 0)`;
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
